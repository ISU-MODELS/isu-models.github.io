<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D - Development</title>
    <link rel="stylesheet" href="styles/letter-page.css">
    <style>
        .application-form { max-width: 600px; margin: 40px auto; padding: 20px; background: #f9f9f9; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .file-input { margin-top: 5px; }
        .error { color: red; font-size: 0.9em; }
        button { padding: 12px 24px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:disabled { background: #999; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="menu-placeholder"></div>

    <section class="section-A d-section-A">
        <h1>Development</h1>
        <p>Build the future of scientific computing with us.</p>
        <a href="#application" class="btn">Apply Now</a>
    </section>

    <section id="application" class="application-form">
        <h2>Application Portal</h2>
        <form id="applyForm" enctype="multipart/form-data">
            <div class="form-group">
                <label>Name *</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" name="phone">
            </div>
            <div class="form-group">
                <label>Cover Letter / Message *</label>
                <textarea name="message" rows="5" required></textarea>
            </div>
            <div class="form-group">
                <label>Curriculum Vitae (PDF, max 5MB) *</label>
                <input type="file" name="cv" accept=".pdf" required class="file-input">
                <span class="error" id="cvError"></span>
            </div>
            <div class="form-group">
                <label>Transcript (PDF, max 5MB) *</label>
                <input type="file" name="ts" accept=".pdf" required class="file-input">
                <span class="error" id="tsError"></span>
            </div>
            <div class="form-group">
                <label>Statement of Interest (PDF, max 5MB) *</label>
                <input type="file" name="soi" accept=".pdf" required class="file-input">
                <span class="error" id="soiError"></span>
            </div>
            <div class="form-group">
                <label>Other Documents (PDF, max 5MB total)</label>
                <input type="file" name="other" accept=".pdf" multiple class="file-input">
                <span class="error" id="otherError"></span>
            </div>
            <div class="form-group">
                <label><strong>Relevant Coursework (check all that apply) *</strong></label>
                <div class="checkbox-grid">
                    <label class="checkbox-label">
                        <input type="checkbox" name="courses" value="Hydrology">
                        <span>Hydrology</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="courses" value="Open Channel Hydraulics">
                        <span>Open Channel Hydraulics</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="courses" value="Soil Chemistry">
                        <span>Soil Chemistry</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="courses" value="Water Chemistry">
                        <span>Water Chemistry</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="courses" value="Nonpoint Source Pollution">
                        <span>Nonpoint Source Pollution</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="courses" value="Numerical Methods">
                        <span>Numerical Methods</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="courses" value="Multivariate Statistics">
                        <span>Multivariate Statistics</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="courses" value="Geospatial Information Systems (GIS)">
                        <span>Geospatial Information Systems (GIS)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="courses" value="Remote Sensing">
                        <span>Remote Sensing</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="courses" value="Machine Learning">
                        <span>Machine Learning</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="courses" value="Agricultural Modeling">
                        <span>Agricultural Modeling</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="courses" value="Watershed Modeling">
                        <span>Watershed Modeling</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="courses" value="Introductory Programming">
                        <span>Introductory Programming</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="courses" value="Advanced Programming">
                        <span>Advanced Programming</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="courses" value="None of the Above">
                        <span>None of the Above</span>
                    </label>
                </div>
                <span class="error" id="coursesError"></span>
            </div>
            <button type="submit" id="submitBtn">Submit Application</button>
            <p id="status"></p>
        </form>
    </section>

    <script>
        fetch('components/menu.html')
            .then(r => r.text())
            .then(d => document.getElementById('menu-placeholder').innerHTML = d);

        const form = document.getElementById('applyForm');
        const cvInput = form.cv;
        const tsInput = form.ts;
        const soiInput = form.soi;
        const otherInput = form.other;
        const cvError = document.getElementById('cvError');
        const tsError = document.getElementById('tsError');
        const soiError = document.getElementById('soiError');
        const otherError = document.getElementById('otherError');
        const status = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        const MAX_CV = 5 * 1024 * 1024;
        const MAX_TS = 5 * 1024 * 1024;
        const MAX_SOI = 5 * 1024 * 1024;
        const MAX_OTHER = 5 * 1024 * 1024;

        function validateFile(file, isCV = false, isTS = false, isSOI = false) {
            if (!file.name.toLowerCase().endsWith('.pdf')) {
                return 'Only PDF files are allowed.';
            }
            if (isCV && file.size > MAX_CV) {
                return 'CV must be ≤ 5MB.';
            }
            if (isTS && file.size > MAX_TS) {
                return 'TS must be ≤ 5MB.';
            }
            if (isSOI && file.size > MAX_SOI) {
                return 'SOI must be ≤ 5MB.';
            }
            return '';
        }

        cvInput.addEventListener('change', () => {
            cvError.textContent = cvInput.files[0] ? validateFile(cvInput.files[0], true, false, false) : '';
        });

        tsInput.addEventListener('change', () => {
            tsError.textContent = tsInput.files[0] ? validateFile(tsInput.files[0], false, true, false) : '';
        });

        soiInput.addEventListener('change', () => {
            soiError.textContent = soiInput.files[0] ? validateFile(soiInput.files[0], false, false, true) : '';
        });

        otherInput.addEventListener('change', () => {
            let total = 0;
            let err = '';
            for (let f of otherInput.files) {
                err = validateFile(f);
                if (err) break;
                total += f.size;
            }
            if (!err && total > MAX_OTHER) err = 'Other documents total must be ≤ 5MB.';
            otherError.textContent = err;
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (cvError.textContent || tsError.textContent || soiError.textContent || otherError.textContent) return;

            submitBtn.disabled = true;
            status.textContent = 'Sending...';

            const data = new FormData(form);
            data.append('to', 'rmcgehee@iastate.edu');

            try {
                const res = await fetch('https://formspree.io/f/your-form-id', { // ← REPLACE WITH YOUR FORMSPREE ID
                    method: 'POST',
                    body: data,
                    headers: { 'Accept': 'application/json' }
                });
                if (res.ok) {
                    status.textContent = 'Application sent successfully!';
                    form.reset();
                } else {
                    status.textContent = 'Error sending application.';
                }
            } catch (err) {
                status.textContent = 'Network error.';
            }
            submitBtn.disabled = false;
        });
    </script>
</body>
</html>
