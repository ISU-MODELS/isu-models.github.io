<text x="662.0" y="144" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#d2d2d7">exactly 1</text>
  <rect x="848" y="56" width="460" height="620" rx="10" fill="#e8f6ee" stroke="#1d1d1f"/>
