  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="662.0" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d1d1f">WEPP file types (one example each)</text>
  <rect x="16" y="56" width="460" height="200" rx="10" fill="#e8f1fb" stroke="#1d1d1f"/>
<text x="28" y="78" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d1d1f">Inputs (5 types)</text>
<text x="28" y="98" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1d1d1f">wepprun.prj</text>
<text x="28" y="110" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#424245">exactly 1; this run 1; e.g. wepprun.prj</text>
<text x="28" y="126" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1d1d1f">*.cli climate</text>
<text x="28" y="138" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#424245">1 to infinite; this run 1; e.g. wepp.cli</text>
<text x="28" y="154" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1d1d1f">*.slp slope</text>
<text x="28" y="166" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#424245">1 to infinite; this run 1; e.g. wepp.slp</text>
<text x="28" y="182" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1d1d1f">*.sol soil</text>
<text x="28" y="194" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#424245">1 to infinite; this run 1; e.g. wepp.sol</text>
<text x="28" y="210" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1d1d1f">*.rot / management</text>
<text x="28" y="222" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#424245">1 to infinite; this run 1; e.g. wepp.rot</text>
  <rect x="512" y="64" width="300" height="108" rx="12" fill="#1d1d1f"/>
