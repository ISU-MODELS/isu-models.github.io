<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Projects</title>
    <link rel="stylesheet" href="styles/projects-page.css">
</head>
<body>
    
    <div id="menu-placeholder"></div>

    <section class="project-page">
        <h1>Discover Our Work</h1>
        <div class="project-grid">

            <!-- Project 1 -->
            <div class="project">
                <img src="headshots/eagle.jpg" alt="Image Unavailable">
                <h2>NRCS-CPF</h2>
                <p>A Cooperative Grant Agreement (CGA) titled 'Building understanding and capacity for utilizing climate projections and forecasts in conservation planning'.</p>
            </div>

            <!-- Project 2 -->
            <div class="project">
                <img src="headshots/lion.jpg" alt="Image Unavailable">
                <h2>NRCS-RCPP</h2>
                <p>A Regional Conservation Planning Project (RCPP) titled 'Working Lands for Resilient People'.</p>
            </div>

        </div>
    </section>

    <script>
        fetch('components/menu.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Error loading menu:', error));
    </script>
</body>
</html>
