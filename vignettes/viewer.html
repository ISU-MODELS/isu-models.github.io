<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODELS Lab Vignette</title>
    <!-- Common Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Vignette Specific Styles -->
    <link rel="stylesheet" href="../styles/vignette.css">
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <!-- Back Navigation -->
    <div class="back-nav">
        <a href="../s-page.html" class="back-btn">&larr; Back to Software</a>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Table of Contents Sidebar -->
        <nav id="toc" class="vignette-toc">
            <h3>Contents</h3>
            <ul id="toc-list"></ul>
        </nav>

        <!-- Content Container -->
        <main id="content" class="vignette-container">
            <div id="loading">Loading vignette...</div>
        </main>
    </div>

    <!-- Vignette Loader Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const topic = params.get('topic');
            const contentDiv = document.getElementById('content');

            if (!topic) {
                contentDiv.innerHTML = '<p>Error: No topic specified.</p>';
                return;
            }

            // Map topics to their specific JS wrapper file paths
            const topicMap = {
                'executing-programs': 'executing-programs/content.js',
                'designing-programs': 'designing-programs/content.js',
                'organizing-programs': 'organizing-programs/content.js',
                'optimizing-programs': 'optimizing-programs/content.js',
                'neuralizing-programs': 'neuralizing-programs/content.js',
                'maintaining-programs': 'maintaining-programs/content.js'
            };

            const filePath = topicMap[topic];

            if (!filePath) {
                contentDiv.innerHTML = '<p>Error: Vignette not found for topic "' + topic + '".</p>';
                return;
            }

            // Load the content script locally (supports file://)
            const script = document.createElement('script');
            script.src = filePath;
            script.onload = () => {
                if (window.vignetteContent) {
                    renderContent(window.vignetteContent);
                } else {
                    contentDiv.innerHTML = '<p>Error: Content variable not found.</p>';
                }
            };
            script.onerror = () => {
                contentDiv.innerHTML = `
                        <h2>Error Loading Content</h2>
                        <p>Could not load the vignette content file (${filePath}).</p>
                        <p>Ensure you are opening this file correctly.</p>
                    `;
            };
            document.head.appendChild(script);

            function renderContent(markdown) {
                // Start rendering
                const renderedHTML = marked.parse(markdown);
                contentDiv.innerHTML = renderedHTML;

                // Post-processing: Fix relative links
                const topicFolder = topic + '/';

                // Fix anchor tags (downloads, links)
                const links = contentDiv.querySelectorAll('a');
                links.forEach(link => {
                    const href = link.getAttribute('href');
                    if (href && !href.match(/^(http|#|\/)/)) {
                        link.setAttribute('href', topicFolder + href);
                    }
                });

                // Generate Table of Contents
                const tocList = document.getElementById('toc-list');
                const headers = contentDiv.querySelectorAll('h2, h3');

                headers.forEach((header, index) => {
                    // Generate ID if missing
                    if (!header.id) {
                        const id = header.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
                        header.id = id || `section-${index}`;
                    }

                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.textContent = header.textContent;
                    a.href = `#${header.id}`;
                    a.className = header.tagName.toLowerCase();

                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        header.scrollIntoView({ behavior: 'smooth' });
                        history.pushState(null, null, `#${header.id}`);
                    });

                    li.appendChild(a);
                    tocList.appendChild(li);
                });

                // Fix images
                const images = contentDiv.querySelectorAll('img');
                images.forEach(img => {
                    const src = img.getAttribute('src');
                    if (src && !src.match(/^(http|\/)/)) {
                        img.setAttribute('src', topicFolder + src);
                    }
                });
            }
        });
    </script>
</body>

</html>
