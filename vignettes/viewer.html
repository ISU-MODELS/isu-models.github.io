<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODELS Lab Vignette</title>
    <!-- Common Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Vignette Specific Styles -->
    <link rel="stylesheet" href="../styles/vignette.css">
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <!-- Back Navigation -->
    <div class="back-nav">
        <a href="../s-page.html" class="back-btn">&larr; Back to Software</a>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Table of Contents Sidebar -->
        <nav id="toc" class="vignette-toc">
            <h3>Contents</h3>
            <ul id="toc-list"></ul>
        </nav>

        <!-- Content Container -->
        <main id="content" class="vignette-container">
            <div id="loading">Loading vignette...</div>
        </main>
    </div>

    <!-- Vignette Loader Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const topic = params.get('topic');
            const contentDiv = document.getElementById('content');

            if (!topic) {
                contentDiv.innerHTML = '<p>Error: No topic specified.</p>';
                return;
            }

            // Map topics to their specific md file paths
            // This allows flexibility if folder structures change
            const topicMap = {
                'executing-programs': 'executing-programs/Executing-Programs-Vignette.md'
            };

            const filePath = topicMap[topic];

            if (!filePath) {
                contentDiv.innerHTML = '<p>Error: Vignette not found for topic "' + topic + '".</p>';
                return;
            }

            // Fetch and render the markdown
            fetch(filePath)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text();
                })
                .then(markdown => {
                    // Start rendering
                    const renderedHTML = marked.parse(markdown);
                    contentDiv.innerHTML = renderedHTML;

                    // Post-processing: Fix relative links
                    // If the markdown links to "demo.py", we need it to point to "executing-programs/demo.py"
                    // NOT "vignettes/demo.py" because we are in "vignettes/viewer.html"

                    const topicFolder = topic + '/'; // e.g., "executing-programs/"

                    // Fix anchor tags (downloads, links)
                    const links = contentDiv.querySelectorAll('a');
                    links.forEach(link => {
                        const href = link.getAttribute('href');
                        // If it's a relative link (doesn't start with http, https, #, or /)
                        if (href && !href.match(/^(http|#|\/)/)) {
                            link.setAttribute('href', topicFolder + href);
                            // If it's a file download (like .py), add download attribute if missing 
                            // (optional, but good UX)
                        }
                    });

                    // Generate Table of Contents
                    const tocList = document.getElementById('toc-list');
                    const headers = contentDiv.querySelectorAll('h2, h3');

                    headers.forEach((header, index) => {
                        // Generate ID if missing
                        if (!header.id) {
                            const id = header.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
                            header.id = id || `section-${index}`;
                        }

                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.textContent = header.textContent;
                        a.href = `#${header.id}`;
                        a.className = header.tagName.toLowerCase(); // 'h2' or 'h3' class

                        // Scroll smoothly
                        a.addEventListener('click', (e) => {
                            e.preventDefault();
                            header.scrollIntoView({ behavior: 'smooth' });
                            // Update URL hash without jumping
                            history.pushState(null, null, `#${header.id}`);
                        });

                        li.appendChild(a);
                        tocList.appendChild(li);
                    });

                    // Fix images
                    const images = contentDiv.querySelectorAll('img');
                    images.forEach(img => {
                        const src = img.getAttribute('src');
                        if (src && !src.match(/^(http|\/)/)) {
                            img.setAttribute('src', topicFolder + src);
                        }
                    });
                })
                .catch(error => {
                    console.error('Error fetching vignette:', error);
                    contentDiv.innerHTML = `
                        <h2>Error Loading Content</h2>
                        <p>Could not load the vignette. Please ensure you are running this via a local server (e.g., <code>python -m http.server</code>) and not opening the file directly.</p>
                        <p>Technical details: ${error.message}</p>
                    `;
                });
        });
    </script>
</body>

</html>
