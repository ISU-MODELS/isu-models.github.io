<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODELS Lab Vignette</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/vignette.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/scripts/posthog.js"></script>
</head>

<body>

    <div class="back-nav">
        <div class="back-nav-left">
            <a href="../pages/s-page.html" class="back-btn">SDT Home</a>
            <a href="https://modelslab.org/" class="back-btn">MODELS Lab</a>
        </div>
        <a id="sdt-console-btn" class="console-btn is-off" role="link" aria-disabled="true" title="Python console host is offline">Launch Python Console</a>
    </div>

    <div class="main-layout">
        <nav id="toc" class="vignette-toc" aria-label="Lesson contents">
            <h3>Contents</h3>
            <ul id="toc-list"></ul>
        </nav>

        <main id="content" class="vignette-container">
            <div id="loading">Loading vignette...</div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const topic = params.get('topic');
            const contentDiv = document.getElementById('content');

            if (!topic) {
                contentDiv.innerHTML = '<p>Error: No topic specified.</p>';
                return;
            }

            const topicMap = {
                'executing-programs': 'executing-programs/content.js',
                'designing-programs': 'designing-programs/content.js',
                'structuring-programs': 'structuring-programs/content.js',
                'optimizing-programs': 'optimizing-programs/content.js',
                'teaching-programs': 'teaching-programs/content.js',
                'releasing-programs': 'releasing-programs/content.js'
            };

            const filePath = topicMap[topic];
            if (!filePath) {
                contentDiv.innerHTML = '<p>Error: Vignette not found for topic "' + topic + '".</p>';
                return;
            }

            const script = document.createElement('script');
            script.src = filePath;
            script.onload = () => {
                if (window.vignetteContent) {
                    renderContent(window.vignetteContent);
                } else {
                    contentDiv.innerHTML = '<p>Error: Content variable not found.</p>';
                }
            };
            script.onerror = () => {
                contentDiv.innerHTML = '<h2>Error Loading Content</h2><p>Could not load ' + filePath + '.</p>';
            };
            document.head.appendChild(script);

            function slugify(text, used) {
                const base = String(text || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'section';
                let id = base;
                let n = 2;
                while (used.has(id)) {
                    id = base + '-' + n;
                    n += 1;
                }
                used.add(id);
                return id;
            }

            function renderContent(markdown) {
                contentDiv.innerHTML = marked.parse(markdown);
                const topicFolder = topic + '/';

                contentDiv.querySelectorAll('a').forEach(link => {
                    const href = link.getAttribute('href');
                    if (href && !href.match(/^(http|#|\/)/)) {
                        link.setAttribute('href', topicFolder + href);
                    }
                });

                const tocList = document.getElementById('toc-list');
                tocList.innerHTML = '';
                const used = new Set();
                const headers = contentDiv.querySelectorAll('h2, h3');
                let subList = null;

                headers.forEach((header) => {
                    header.id = slugify(header.textContent, used);
                    const a = document.createElement('a');
                    a.textContent = header.textContent;
                    a.href = '#' + header.id;
                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        header.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        history.replaceState(null, '', '#' + header.id);
                    });
                    if (header.tagName === 'H2') {
                        const wrap = document.createElement('li');
                        wrap.className = 'h2';
                        wrap.appendChild(a);
                        subList = document.createElement('ul');
                        wrap.appendChild(subList);
                        tocList.appendChild(wrap);
                        return;
                    }
                    const li = document.createElement('li');
                    li.className = 'h3';
                    li.appendChild(a);
                    if (subList) subList.appendChild(li);
                    else tocList.appendChild(li);
                });

                contentDiv.querySelectorAll('img').forEach(img => {
                    const src = img.getAttribute('src');
                    if (src && !src.match(/^(http|\/)/)) {
                        img.setAttribute('src', topicFolder + src);
                    }
                });
            }
        });
    </script>
    <script src="host-status.js"></script>
</body>

</html>
